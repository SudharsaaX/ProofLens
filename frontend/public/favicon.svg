<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b153a"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915eff"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#915eff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-opacity="0.4"/>

  <!-- Reticle Corner Framing Brackets -->
  <g stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Top-Left -->
    <path d="M 136 184 V 136 H 184" />
    <!-- Top-Right -->
    <path d="M 328 136 H 376 V 184" />
    <!-- Bottom-Left -->
    <path d="M 136 328 V 376 H 184" />
    <!-- Bottom-Right -->
    <path d="M 328 376 H 376 V 328" />

    <!-- Center Scan Eye Lens Contour -->
    <path d="M 152 256 C 190 196, 322 196, 360 256 C 322 316, 190 316, 152 256 Z" />
  </g>

  <!-- Central Iris Pupil Circle -->
  <circle cx="256" cy="256" r="42" fill="url(#primaryGrad)" filter="url(#glow)" />
  <!-- Aperture Center -->
  <circle cx="256" cy="256" r="20" fill="#050816" />
</svg>
